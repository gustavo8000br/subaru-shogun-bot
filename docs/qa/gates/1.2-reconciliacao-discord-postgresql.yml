    finding: 'Schema e fluxo não possuem ProvisioningOperation/outbox/requestId durável; retry/restart e ownership por operação estão ausentes.'
    suggested_action: 'Criar epic/stories técnicas dependentes para persistência de operação, ownership e retry idempotente; não substituir com estado em memória nem reduzir ACs.'
    suggested_owner: sm
