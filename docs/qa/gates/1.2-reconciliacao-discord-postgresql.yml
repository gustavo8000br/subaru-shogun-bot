    suggested_action: 'Decompor em stories de reconciliador com fetch/ownership/duas confirmações/periodicidade e lifecycle closing→closed não destrutivo; cobrir os caminhos legados de cleanup antes de aceitar ACs.'
    suggested_owner: architect
  - id: 'STORY-1.2-OUTBOX-REQUESTID-MISSING'
