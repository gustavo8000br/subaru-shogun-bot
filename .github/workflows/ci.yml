name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests without database environment
        run: |
          env -u DATABASE_URL -u AIOX_TEST_DATABASE npm test
          echo 'PostgreSQL-only tests are intentionally skipped in this unit-test step; they run in the isolated Compose integration step.' >> "$GITHUB_STEP_SUMMARY"

      - name: PostgreSQL ephemeral integration
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Prisma schema validation
        env:
          # Prisma requires a datasource value during validation; this URI is
          # deliberately unreachable and validation does not open a connection.
          DATABASE_URL: postgresql://schema_validation:local_only@127.0.0.1:1/schema_validation?schema=public
        run: npx prisma validate

      - name: Production dependency audit (raw JSON retained in logs)
        shell: bash
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/npm-audit-production.json"
          if npm audit --omit=dev --json > "$audit_file"; then
            audit_exit=0
          else
            audit_exit=$?
          fi
          cat "$audit_file"
          node scripts/validate-audit-waiver.mjs "$audit_file" "$audit_exit" production | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full dependency audit (raw JSON retained in logs)
        shell: bash
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/npm-audit-full.json"
          if npm audit --json > "$audit_file"; then
            audit_exit=0
          else
            audit_exit=$?
          fi
          cat "$audit_file"
          node scripts/validate-audit-waiver.mjs "$audit_file" "$audit_exit" full | tee -a "$GITHUB_STEP_SUMMARY"
