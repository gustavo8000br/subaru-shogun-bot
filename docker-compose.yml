version: '3.9'

services:
  app:
    build: .
    container_name: subaru-shogun-bot
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: subaru-shogun-db
    environment:
      POSTGRES_DB: subaru_shogun
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
