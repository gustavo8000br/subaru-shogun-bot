services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shogun_test
      POSTGRES_USER: shogun_test
      POSTGRES_PASSWORD: shogun_test_ephemeral_only
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shogun_test -d shogun_test"]
      interval: 1s
      timeout: 2s
      retries: 30
